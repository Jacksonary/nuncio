[package]
name = "nuncio"
version = "0.1.0"
description = "Nuncio - lightweight mail, calendar, contacts and to-do client"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Jacksonary/nuncio"
homepage = "https://jacksonary.github.io/nuncio/"
default-run = "nuncio"

[lib]
name = "nuncio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nuncio-core = { path = "crates/core" }
nuncio-auth = { path = "crates/auth" }
nuncio-mime = { path = "crates/mime" }
nuncio-ical = { path = "crates/ical" }
nuncio-mail = { path = "crates/mail" }
nuncio-pim = { path = "crates/pim" }
tauri = { workspace = true }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
mime_guess = { workspace = true }
urlencoding = { workspace = true }
rusqlite = { workspace = true }
# Not in [workspace.dependencies]: tiny OS UI-language probe used by language.rs.
sys-locale = "0.3"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.36"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
webpki-roots = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-no-provider", "rustls-platform-verifier", "hostname", "pool"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
mail-builder = "2"
ammonia = "4"
html2text = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip", "stream", "query", "form", "charset", "http2"] }
quick-xml = { version = "0.42", features = ["serialize"] }
rrule = "0.14"
calcard = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
argon2 = "0.5"
aes-gcm = "0.10"
hickory-resolver = "0.26"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
url = "2"
urlencoding = "2"
futures = "0.3"
mime_guess = "2"
regex = "1"
encoding_rs = "0.8"
async-trait = "0.1"
bytes = "1"
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
